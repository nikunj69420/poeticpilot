  <div id="root" data-composition-id="route" data-width="1920" data-height="1080">
    <div id="route-stage" class="clip" data-start="0" data-duration="10" data-track-index="0" data-layout-allow-overflow>
      <!-- chart grid: drifts exactly one cell over the loop so frame 0 and frame 300 match -->
      <svg id="route-grid" viewBox="0 0 2160 1200" data-layout-ignore>
        <defs>
          <pattern id="route-cell" width="120" height="120" patternUnits="userSpaceOnUse">
            <path d="M120 0H0V120" fill="none" stroke="rgba(157,180,214,0.08)" stroke-width="1" />
            <circle cx="0" cy="0" r="1.6" fill="rgba(157,180,214,0.22)" />
          </pattern>
        </defs>
        <rect width="2160" height="1200" fill="url(#route-cell)" />
      </svg>

      <!-- compass rose around the Delhi base: ticks every 10deg, turns 10deg per loop -->
      <svg id="route-rose" viewBox="-450 -450 900 900" data-layout-ignore>
        <circle r="150" fill="none" stroke="rgba(157,180,214,0.10)" />
        <circle r="300" fill="none" stroke="rgba(157,180,214,0.09)" stroke-dasharray="2 8" />
        <circle r="440" fill="none" stroke="rgba(157,180,214,0.06)" />
        <g id="route-ticks" stroke="rgba(157,180,214,0.22)" stroke-width="1.5"></g>
      </svg>

      <svg id="route-svg" viewBox="0 0 1920 1080" data-layout-ignore>
        <defs>

      <!-- the aircraft rides an arm pivoting on the arc's centre, so it stays exactly on the path -->
      <div id="route-arm">

              <path
                d="M44 24c0-1.6-1.3-2.4-3-2.4H30.5L20 6h-4.2l5.4 15.6H11.4L8 17H4.6l2.2 7-2.2 7H8l3.4-4.6h9.8L15.8 42H20l10.5-15.6H41c1.7 0 3-.8 3-2.4z"
                fill="#f5c518"

            </svg>

  <script>
    // tick marks built once at load (deterministic, before the timeline is registered)
    const ticks = document.getElementById("route-ticks");
    for (let a = 0; a < 360; a += 10) {
      const r = (a * Math.PI) / 180;
      const long = a % 30 === 0;
      const r1 = long ? 282 : 290;
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", (Math.cos(r) * r1).toFixed(2));
      line.setAttribute("y1", (Math.sin(r) * r1).toFixed(2));
      line.setAttribute("x2", (Math.cos(r) * 312).toFixed(2));
      line.setAttribute("y2", (Math.sin(r) * 312).toFixed(2));
      ticks.appendChild(line);
    }

    const tl = gsap.timeline({ paused: true });

    // continuous world: chart and rose drift linearly and land on an identical frame at 10 s
    tl.fromTo("#route-grid", { x: 0 }, { x: -120, duration: 10, ease: "none" }, 0);
    tl.fromTo("#route-rose", { rotation: 0 }, { rotation: 10, duration: 10, ease: "none", transformOrigin: "50% 50%" }, 0);

    // resting state shared by the first and last frame
    tl.set("#route-plane", { opacity: 0, scale: 0.6 }, 0);
    tl.set(["#route-pulse-a", "#route-pulse-b"], { opacity: 0, scale: 1 }, 0);
    tl.set(["#route-ring-b", "#route-dot-b"], { opacity: 0.35 }, 0);
    tl.set(["#route-code-b", "#route-name-b"], { opacity: 0, filter: "blur(8px)" }, 0);
    tl.set("#route-arm", { rotation: 237 }, 0);
    tl.set(["#route-line", "#route-line-glow"], { attr: { "stroke-dashoffset": 1.1 } }, 0);

    // departure: Delhi pulses, aircraft appears
    tl.fromTo("#route-pulse-a", { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 3.2, duration: 1.1, ease: "power2.out" }, 0.9);
    tl.fromTo("#route-plane", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 0.95);

    // the flight: line and aircraft share one ease so the nose always sits on the line's tip
    tl.fromTo(["#route-line", "#route-line-glow"], { attr: { "stroke-dashoffset": 1 } }, { attr: { "stroke-dashoffset": 0 }, duration: 4, ease: "power2.inOut" }, 0.9);
    tl.fromTo("#route-arm", { rotation: 237 }, { rotation: 303, duration: 4, ease: "power2.inOut" }, 0.9);

    // arrival: the aircraft folds into the Bengaluru waypoint, which wakes up
    tl.to("#route-plane", { scale: 0, opacity: 0, duration: 0.45, ease: "power3.in" }, 4.75);
    tl.to(["#route-ring-b", "#route-dot-b"], { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.05);
    tl.fromTo("#route-pulse-b", { opacity: 0.8, scale: 1 }, { opacity: 0, scale: 3.4, duration: 1.2, ease: "power2.out" }, 5.1);
    tl.to("#route-code-b", { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 5.15);
    tl.to("#route-name-b", { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out" }, 5.23);

    // hold, then the route lifts away tail-first toward Bengaluru
    tl.fromTo(["#route-line", "#route-line-glow"], { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -1 }, duration: 1.4, ease: "power2.inOut" }, 7.2);
    tl.set(["#route-line", "#route-line-glow"], { attr: { "stroke-dashoffset": -1.1 } }, 8.65);
    tl.to(["#route-name-b", "#route-code-b"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", stagger: 0.07 }, 8.4);
    tl.to(["#route-ring-b", "#route-dot-b"], { opacity: 0.35, duration: 0.4, ease: "power2.inOut" }, 8.5);

    window.__timelines["route"] = tl;
  </script>
